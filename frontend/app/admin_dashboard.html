<html lang="en" vid="0"><head vid="1">

<body class="h-screen w-full flex flex-col overflow-hidden text-neutral-900 antialiased selection:bg-neutral-200 selection:text-neutral-900" vid="7">

                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" vid="12"></path>

        <div class="flex items-center" vid="16">

    <div class="flex-1 flex overflow-hidden bg-[#fafafa]" vid="18">
        <aside class="w-60 border-r border-neutral-200 bg-white flex flex-col py-4 shrink-0 hidden md:flex z-0" vid="19">
            <nav class="flex-1 px-3 space-y-1" vid="20">
                <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-md bg-neutral-100 text-neutral-900 transition-colors duration-200" vid="21">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-neutral-700" vid="22">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" vid="23"></path>
                        <polyline points="9 22 9 12 15 12 15 22" vid="24"></polyline>
                    </svg>
                    Home
                </a>

                <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-md text-neutral-600 hover:bg-neutral-50 hover:text-neutral-900 transition-colors duration-200" onclick="openModal('join')" vid="25">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-neutral-500" vid="26">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" vid="27"></path>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" vid="28"></path>
                    </svg>
                    Join Workspace
                </a>

                <div class="pt-6 pb-2" vid="29">
                    <p class="px-3 text-xs font-semibold text-neutral-400 tracking-wider uppercase" vid="30">Resources</p>
                </div>

                <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-md text-neutral-600 hover:bg-neutral-50 hover:text-neutral-900 transition-colors duration-200" vid="31">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-neutral-500" vid="32">
                        <circle cx="12" cy="12" r="10" vid="33"></circle>
                        <line x1="12" y1="16" x2="12" y2="12" vid="34"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8" vid="35"></line>
                    </svg>
                    About
                </a>

                <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-md text-neutral-600 hover:bg-neutral-50 hover:text-neutral-900 transition-colors duration-200" vid="36">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-neutral-500" vid="37">
                        <circle cx="12" cy="12" r="10" vid="38"></circle>
                        <circle cx="12" cy="12" r="4" vid="39"></circle>
                        <line x1="4.93" y1="4.93" x2="9.17" y2="9.17" vid="40"></line>
                        <line x1="14.83" y1="14.83" x2="19.07" y2="19.07" vid="41"></line>
                        <line x1="14.83" y1="9.17" x2="19.07" y2="4.93" vid="42"></line>
                        <line x1="14.83" y1="9.17" x2="18.36" y2="5.64" vid="43"></line>
                        <line x1="4.93" y1="19.07" x2="9.17" y2="14.83" vid="44"></line>
                    </svg>
                    Support
                </a>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col items-center justify-center p-8 overflow-y-auto" vid="45">
            <div class="max-w-md w-full text-center" vid="46">
                <div class="mb-8 relative" vid="47">
                    <div class="w-32 h-32 bg-neutral-100 rounded-3xl mx-auto flex items-center justify-center border border-neutral-200 shadow-sm relative overflow-hidden" vid="48">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#d4d4d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="relative z-10" vid="49">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" vid="50"></path>
                        </svg>
                        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#a3a3a3_1px,transparent_1px)] [background-size:16px_16px]" vid="51"></div>
                    </div>
                </div>

                <h1 class="text-2xl font-semibold tracking-tight text-neutral-900 mb-2" vid="52">No workspaces yet</h1>
                <p class="text-neutral-500 text-sm leading-relaxed mb-10 max-w-[320px] mx-auto" vid="53">
                    Get started by creating your own workspace or joining an existing one with an invite code.
                </p>

                <div class="flex flex-col gap-3" vid="54">
                    <button onclick="openModal('create')" class="w-full py-2.5 px-4 bg-neutral-900 text-white text-sm font-medium rounded-lg hover:bg-neutral-800 transition-all duration-200 shadow-sm flex items-center justify-center gap-2" vid="55">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vid="56">
                            <line x1="12" y1="5" x2="12" y2="19" vid="57"></line>
                            <line x1="5" y1="12" x2="19" y2="12" vid="58"></line>
                        </svg>
                        Create Workspace
                    </button>
                    <button onclick="openModal('join')" class="w-full py-2.5 px-4 bg-white border border-neutral-200 text-neutral-700 text-sm font-medium rounded-lg hover:bg-neutral-50 hover:text-neutral-900 transition-all duration-200 flex items-center justify-center gap-2" vid="59">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vid="60">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" vid="61"></path>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" vid="62"></path>
                        </svg>
                        Join Workspace
                    </button>
                </div>
            </div>
        </main>
    </div>

    <div id="modalBackdrop" class="fixed inset-0 bg-neutral-900/20 backdrop-blur-[2px] z-50 opacity-0 pointer-events-none transition-opacity duration-200 ease-out" onclick="closeModal()" vid="63"></div>

    <div id="modalContainer" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 w-full max-w-sm px-4 opacity-0 pointer-events-none transition-all duration-200 ease-out scale-95" vid="64">
        <div class="bg-white rounded-xl shadow-xl border border-neutral-200 overflow-hidden" onclick="event.stopPropagation()" vid="65">
            <div class="flex items-center justify-between px-5 py-4 border-b border-neutral-100" vid="66">
                <h2 id="modalTitle" class="text-base font-semibold text-neutral-900" vid="67">Join Workspace</h2>
                <button onclick="closeModal()" class="text-neutral-400 hover:text-neutral-600 transition-colors p-1 rounded-md hover:bg-neutral-100" vid="68">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vid="69">
                        <line x1="18" y1="6" x2="6" y2="18" vid="70"></line>
                        <line x1="6" y1="6" x2="18" y2="18" vid="71"></line>
                    </svg>
                </button>
            </div>
            
            <div id="joinContent" class="p-5" vid="72">
                <label for="workspaceCode" class="block text-sm font-medium text-neutral-700 mb-1.5" vid="73">Workspace Code</label>
                <input type="text" id="workspaceCode" placeholder="e.g. D9X-2B4" class="w-full px-3 py-2 bg-white border border-neutral-200 rounded-lg text-sm text-neutral-900 placeholder:text-neutral-400 focus:outline-none focus:border-neutral-400 focus:ring-1 focus:ring-neutral-400 transition-all" vid="74">
                <p class="mt-2 text-xs text-neutral-500" vid="75">Ask your workspace admin for the 6-character invite code.</p>
            </div>

            <div id="createContent" class="p-5 hidden" vid="76">
                <label for="workspaceName" class="block text-sm font-medium text-neutral-700 mb-1.5" vid="77">Workspace Name</label>
                <input type="text" id="workspaceName" placeholder="My Awesome Project" class="w-full px-3 py-2 bg-white border border-neutral-200 rounded-lg text-sm text-neutral-900 placeholder:text-neutral-400 focus:outline-none focus:border-neutral-400 focus:ring-1 focus:ring-neutral-400 transition-all" vid="78">
                <p class="mt-2 text-xs text-neutral-500" vid="79">Choose a name that reflects the team or project.</p>
            </div>

            <div class="px-5 py-4 bg-neutral-50 border-t border-neutral-100 flex justify-end gap-3" vid="80">
                <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-neutral-600 hover:text-neutral-900 transition-colors" vid="81">
                    Cancel
                </button>
                <button id="modalActionButton" class="px-4 py-2 bg-neutral-900 text-white text-sm font-medium rounded-lg hover:bg-neutral-800 transition-colors focus:outline-none focus:ring-2 focus:ring-neutral-900 focus:ring-offset-1" vid="82">
                    Join Workspace
                </button>
            </div>
        </div>
    </div>

    <script vid="83">
        const modalBackdrop = document.getElementById('modalBackdrop');
        const modalContainer = document.getElementById('modalContainer');
        const joinContent = document.getElementById('joinContent');
        const createContent = document.getElementById('createContent');
        const modalTitle = document.getElementById('modalTitle');
        const modalActionButton = document.getElementById('modalActionButton');
        const workspaceCodeInput = document.getElementById('workspaceCode');
        const workspaceNameInput = document.getElementById('workspaceName');

        function openModal(type) {
            if (type === 'create') {
                modalTitle.textContent = 'Create Workspace';
                modalActionButton.textContent = 'Create Workspace';
                joinContent.classList.add('hidden');
                createContent.classList.remove('hidden');
                setTimeout(() => workspaceNameInput.focus(), 100);
            } else {
                modalTitle.textContent = 'Join Workspace';
                modalActionButton.textContent = 'Join Workspace';
                createContent.classList.add('hidden');
                joinContent.classList.remove('hidden');
                setTimeout(() => workspaceCodeInput.focus(), 100);
            }

            modalBackdrop.classList.remove('pointer-events-none');
            modalContainer.classList.remove('pointer-events-none');
            
            requestAnimationFrame(() => {
                modalBackdrop.classList.remove('opacity-0');
                modalBackdrop.classList.add('opacity-100');
                modalContainer.classList.remove('opacity-0', 'scale-95');
                modalContainer.classList.add('opacity-100', 'scale-100');
            });
        }

        function closeModal() {
            modalBackdrop.classList.remove('opacity-100');
            modalBackdrop.classList.add('opacity-0');
            modalContainer.classList.remove('opacity-100', 'scale-100');
            modalContainer.classList.add('opacity-0', 'scale-95');
            
            setTimeout(() => {
                modalBackdrop.classList.add('pointer-events-none');
                modalContainer.classList.add('pointer-events-none');
                workspaceCodeInput.value = '';
                workspaceNameInput.value = '';
            }, 200);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modalContainer.classList.contains('opacity-0')) {
                closeModal();
            }
        });
    </script>
</body></html>
